<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meja Hold'em</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <h1>Meja Hold'em</h1>
  <p class="sub">Poker Texas Hold'em untuk 2–6 pemain. Chip hanya mainan, tanpa uang sungguhan.</p>
  <div class="box">
    <input id="name" placeholder="Nama kamu" maxlength="14" autocomplete="off">
    <div class="row"><button id="mk">Buat meja</button></div>
    <div class="row">
      <input id="code" placeholder="Kode meja" maxlength="5" autocomplete="off" style="text-transform:uppercase">
      <button class="sec" id="jn">Gabung</button>
    </div>
  </div>
  <div id="st"></div>
</main>
<script src="frontend/landing.js"></script>
</body>
</html>
